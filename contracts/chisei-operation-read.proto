syntax = "proto3";
package chisei;

message GetOperationReceiptRequest {
  string operation_id = 1;
  string request_id = 2;
  string caller_scope = 3;
  uint32 attempt = 4;
}
message GetOperationReceiptResponse {
  string receipt_json = 1;
  bool complete = 2;
  repeated string missing_surfaces = 3;
}

message GetSampleObservationRequest {
  string request_id = 1;
  string namespace = 2;
}

message SampleObservationReadback {
  string request_id = 1;
  string namespace = 2;
  string observation_digest = 3;
  string state = 4;
  int64 observed_at = 5;
  int64 read_at = 6;
}

message GetSampleObservationResponse {
  SampleObservationReadback observation = 1;
}

service ChiseiService {
  rpc GetOperationReceipt(GetOperationReceiptRequest) returns (GetOperationReceiptResponse);
  rpc GetSampleObservation(GetSampleObservationRequest) returns (GetSampleObservationResponse);
}
