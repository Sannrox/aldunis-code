name: Publish managed Code image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "code-v*"

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  SHIKIGAMI_IMAGE: ghcr.io/sannrox/shikigami@sha256:91c9ea4f3ef0c59b91cf57a1cc7b3a849c80ea02d984c6a8db71c9736e966a95
  SHIKIGAMI_REVISION: 8de00f0d715b1e73573a58f84ccdc157d1f98ca2

jobs:
  smoke:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    name: Smoke managed Code image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for restricted smoke
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.managed
          platforms: linux/amd64
          load: true
          push: false
          tags: aldunis-code:managed-smoke
          build-args: |
            SHIKIGAMI_IMAGE=${{ env.SHIKIGAMI_IMAGE }}
            SHIKIGAMI_REVISION=${{ env.SHIKIGAMI_REVISION }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=1970-01-01T00:00:00Z
            SOURCE_URL=https://github.com/${{ github.repository }}

      - name: Run restricted image smoke
        run: bash scripts/managed-image-smoke.sh aldunis-code:managed-smoke "$SHIKIGAMI_IMAGE" "$SHIKIGAMI_REVISION"

  publish:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    name: Publish linux/amd64 image
    needs: smoke
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/aldunis-code
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build and push image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.managed
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.metadata.outputs.created }}
            SOURCE_URL=https://github.com/${{ github.repository }}
            SHIKIGAMI_IMAGE=${{ env.SHIKIGAMI_IMAGE }}
            SHIKIGAMI_REVISION=${{ env.SHIKIGAMI_REVISION }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Record immutable image reference
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'Image: %s@%s\n' "$IMAGE_NAME" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          printf 'Platform must consume the digest above and set the matching Code revision label.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Admit and roll out the staging Catalog release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          CATALOG_API_URL: ${{ vars.ALDUNIS_CATALOG_API_URL }}
          CATALOG_PUBLISH_TOKEN: ${{ secrets.ALDUNIS_CATALOG_PUBLISH_TOKEN }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_REVISION: ${{ github.sha }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          test -n "$CATALOG_API_URL" || {
            echo "ALDUNIS_CATALOG_API_URL repository variable is required" >&2
            exit 1
          }
          test -n "$CATALOG_PUBLISH_TOKEN" || {
            echo "ALDUNIS_CATALOG_PUBLISH_TOKEN repository secret is required" >&2
            exit 1
          }
          case "$CATALOG_API_URL" in
            https://*) ;;
            *) echo "ALDUNIS_CATALOG_API_URL must use HTTPS" >&2; exit 1 ;;
          esac
          CATALOG_API_URL="${CATALOG_API_URL%/}"
          printf '%s\n' "$IMAGE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$' || {
            echo "published image digest is not immutable" >&2
            exit 1
          }
          printf '%s\n' "$SOURCE_REVISION" | grep -Eq '^[0-9a-f]{40}$' || {
            echo "source revision is not a full Git revision" >&2
            exit 1
          }
          catalog_image="${IMAGE_NAME,,}"
          test "$catalog_image" = 'ghcr.io/sannrox/aldunis-code' || {
            echo "managed Code image is not the approved GHCR repository" >&2
            exit 1
          }

          release_id="code-$SOURCE_REVISION"
          publish_payload="$(jq -cn \
            --arg release_id "$release_id" \
            --arg image "$catalog_image@$IMAGE_DIGEST" \
            --arg revision "$SOURCE_REVISION" \
            '{release_id: $release_id, image: $image, revision: $revision, channel: "staging"}')"
          publish_response="$(mktemp)"
          rollout_response="$(mktemp)"
          cleanup() {
            rm -f "$publish_response" "$rollout_response"
          }
          trap cleanup EXIT

          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 \
            --connect-timeout 10 --max-time 60 \
            --header "Authorization: Bearer $CATALOG_PUBLISH_TOKEN" \
            --header 'Content-Type: application/json' \
            --header "X-Request-ID: github-code-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --data "$publish_payload" \
            "$CATALOG_API_URL/code/publish" > "$publish_response"

          test "$(jq -r '.published // false' "$publish_response")" = true
          catalog_release_id="$(jq -er '.catalog_release_id' "$publish_response")"
          jq -e '(.catalog_release_id | type) == "string" and (.manifest_digest | startswith("sha256:"))' \
            "$publish_response" >/dev/null

          rollout_payload="$(jq -cn --arg release_id "$catalog_release_id" '{release_id: $release_id}')"
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 \
            --connect-timeout 10 --max-time 60 \
            --header "Authorization: Bearer $CATALOG_PUBLISH_TOKEN" \
            --header 'Content-Type: application/json' \
            --header "X-Request-ID: github-code-rollout-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --data "$rollout_payload" \
            "$CATALOG_API_URL/code/rollout" > "$rollout_response"

          jq -e '.operation.state == "promoted" or .operation.state == "succeeded"' \
            "$rollout_response" >/dev/null
          {
            printf 'Catalog release: %s\n' "$catalog_release_id"
            printf 'Tenkai rollout requested for: %s\n' "$release_id"
          } >> "$GITHUB_STEP_SUMMARY"
