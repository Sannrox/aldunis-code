name: Desktop release evidence

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:desktop-release-tag -- "${GITHUB_REF_NAME}"
      - run: npm run check
      - run: npm test
      - run: npm run build

  macos:
    name: macOS ${{ matrix.arch }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    environment: desktop-macos-signing
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    env:
      CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "${APPLE_API_KEY_P8}" > "${key_path}"
          chmod 600 "${key_path}"
          echo "APPLE_API_KEY=${key_path}" >> "${GITHUB_ENV}"
      - run: npm run build
      - name: Build signed and notarized package
        run: >-
          npx electron-builder
          --mac dmg
          --${{ matrix.arch }}
          --publish never
          -c.forceCodeSigning=true
          -c.mac.notarize=true
      - name: Notarize and staple disk image
        shell: bash
        run: |
          dmg_path="$(find release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "${dmg_path}"
          xcrun notarytool submit "${dmg_path}" \
            --key "${APPLE_API_KEY}" \
            --key-id "${APPLE_API_KEY_ID}" \
            --issuer "${APPLE_API_ISSUER}" \
            --wait
          xcrun stapler staple "${dmg_path}"
      - name: Verify signature, notarization, and stapling
        shell: bash
        run: |
          set -o pipefail
          app_path="$(find release -type d -name '*.app' -print -quit)"
          dmg_path="$(find release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "${app_path}"
          test -n "${dmg_path}"
          {
            codesign --verify --deep --strict --verbose=2 "${app_path}"
            spctl --assess --type execute --verbose=2 "${app_path}"
            xcrun stapler validate "${app_path}"
            xcrun stapler validate "${dmg_path}"
          } 2>&1 | tee "release/verification-macos-${{ matrix.arch }}.txt"
          shasum -a 256 "${dmg_path}" > "release/SHA256SUMS-macos-${{ matrix.arch }}.txt"
      - uses: actions/attest@v4
        with:
          subject-path: release/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/SHA256SUMS-macos-${{ matrix.arch }}.txt
            release/verification-macos-${{ matrix.arch }}.txt

  windows:
    needs: validate
    runs-on: windows-2025
    environment: desktop-windows-signing
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build signed installer
        run: npx electron-builder --win nsis --x64 --publish never -c.forceCodeSigning=true
      - name: Verify Authenticode and checksums
        shell: pwsh
        run: |
          $installers = Get-ChildItem release -File -Filter *.exe
          if ($installers.Count -eq 0) {
            throw "No Windows installer was produced."
          }
          $evidence = foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature for $($installer.Name): $($signature.Status)"
            }
            "$($installer.Name): $($signature.Status); $($signature.SignerCertificate.Subject)"
          }
          $evidence | Tee-Object -FilePath release/verification-windows-x64.txt
          $checksums = foreach ($installer in $installers) {
            $hash = Get-FileHash -Algorithm SHA256 $installer.FullName
            "$($hash.Hash.ToLowerInvariant())  $($installer.Name)"
          }
          $checksums | Set-Content release/SHA256SUMS-windows-x64.txt
      - uses: actions/attest@v4
        with:
          subject-path: release/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64
          if-no-files-found: error
          path: |
            release/*.exe
            release/SHA256SUMS-windows-x64.txt
            release/verification-windows-x64.txt

  linux:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build native packages
        run: npx electron-builder --linux AppImage deb --x64 --publish never
      - name: Record package checksums
        run: |
          sha256sum release/*.AppImage release/*.deb > release/SHA256SUMS-linux-x64.txt
          file release/*.AppImage release/*.deb | tee release/verification-linux-x64.txt
      - uses: actions/attest@v4
        with:
          subject-path: |
            release/*.AppImage
            release/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-x64
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb
            release/SHA256SUMS-linux-x64.txt
            release/verification-linux-x64.txt
