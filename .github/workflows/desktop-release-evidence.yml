name: Desktop release and preview evidence

on:
  push:
    tags:
      - "v*"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.event_name == 'push' && github.ref || 'preview' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.metadata.outputs.channel }}
      base_version: ${{ steps.metadata.outputs.base_version }}
      version: ${{ steps.metadata.outputs.version }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      source_ref: ${{ steps.metadata.outputs.source_ref }}
      artifact_prefix: ${{ steps.metadata.outputs.artifact_prefix }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'main' }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve release identity
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          source_ref="$(git rev-parse HEAD)"
          base_version="$(node -p 'require("./package.json").version')"
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == refs/tags/v* ]]; then
            channel="stable"
            version="${base_version}"
            release_tag="${GITHUB_REF_NAME}"
            artifact_prefix="desktop"
          else
            channel="preview"
            utc_date="$(date -u +%Y%m%d)"
            version="$(npm run --silent preview:version -- "${base_version}" "${utc_date}" "${GITHUB_RUN_NUMBER}")"
            release_tag="preview-v${version}"
            artifact_prefix="desktop-preview"
          fi
          {
            echo "channel=${channel}"
            echo "base_version=${base_version}"
            echo "version=${version}"
            echo "release_tag=${release_tag}"
            echo "source_ref=${source_ref}"
            echo "artifact_prefix=${artifact_prefix}"
          } >> "${GITHUB_OUTPUT}"

  validate:
    needs: prepare
    outputs:
      channel: ${{ needs.prepare.outputs.channel }}
      base_version: ${{ needs.prepare.outputs.base_version }}
      version: ${{ needs.prepare.outputs.version }}
      release_tag: ${{ needs.prepare.outputs.release_tag }}
      source_ref: ${{ needs.prepare.outputs.source_ref }}
      artifact_prefix: ${{ needs.prepare.outputs.artifact_prefix }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify stable release tag
        if: needs.prepare.outputs.channel == 'stable'
        run: npm run verify:desktop-release-tag -- "${{ needs.prepare.outputs.release_tag }}"
      - name: Set preview package version
        if: needs.prepare.outputs.channel == 'preview'
        env:
          PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
        run: npm version --no-git-tag-version "${PACKAGE_VERSION}"
      - run: npm run check
      - run: npm test
      - run: npm run build

  macos:
    name: macOS ${{ matrix.arch }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    environment: desktop-macos-signing
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      PACKAGE_VERSION: ${{ needs.validate.outputs.version }}
      BASE_VERSION: ${{ needs.validate.outputs.base_version }}
      CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.source_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set preview package version
        if: needs.validate.outputs.channel == 'preview'
        run: npm version --no-git-tag-version "${PACKAGE_VERSION}"
      - name: Install App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "${APPLE_API_KEY_P8}" > "${key_path}"
          chmod 600 "${key_path}"
          echo "APPLE_API_KEY=${key_path}" >> "${GITHUB_ENV}"
      - run: npm run build
      - name: Build signed and notarized package
        run: >-
          npx electron-builder
          --mac dmg
          --${{ matrix.arch }}
          --publish never
          -c.forceCodeSigning=true
          -c.mac.notarize=true
          -c.mac.bundleShortVersion="${BASE_VERSION}"
          -c.mac.bundleVersion="${BASE_VERSION}"
      - name: Give preview DMG a unique architecture name
        if: needs.validate.outputs.channel == 'preview'
        shell: bash
        run: |
          set -euo pipefail
          for dmg_path in release/*.dmg; do
            mv "${dmg_path}" "${dmg_path%.dmg}-${{ matrix.arch }}.dmg"
          done
      - name: Notarize and staple disk image
        shell: bash
        run: |
          dmg_path="$(find release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "${dmg_path}"
          xcrun notarytool submit "${dmg_path}" \
            --key "${APPLE_API_KEY}" \
            --key-id "${APPLE_API_KEY_ID}" \
            --issuer "${APPLE_API_ISSUER}" \
            --wait
          xcrun stapler staple "${dmg_path}"
      - name: Verify signature, notarization, and stapling
        shell: bash
        run: |
          set -o pipefail
          app_path="$(find release -type d -name '*.app' -print -quit)"
          dmg_path="$(find release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "${app_path}"
          test -n "${dmg_path}"
          {
            codesign --verify --deep --strict --verbose=2 "${app_path}"
            spctl --assess --type execute --verbose=2 "${app_path}"
            xcrun stapler validate "${app_path}"
            xcrun stapler validate "${dmg_path}"
          } 2>&1 | tee "release/verification-macos-${{ matrix.arch }}.txt"
          shasum -a 256 "${dmg_path}" > "release/SHA256SUMS-macos-${{ matrix.arch }}.txt"
      - uses: actions/attest@v4
        with:
          subject-path: release/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.validate.outputs.artifact_prefix }}-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/SHA256SUMS-macos-${{ matrix.arch }}.txt
            release/verification-macos-${{ matrix.arch }}.txt

  windows:
    needs: validate
    runs-on: windows-2025
    environment: desktop-windows-signing
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      PACKAGE_VERSION: ${{ needs.validate.outputs.version }}
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.source_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set preview package version
        if: needs.validate.outputs.channel == 'preview'
        shell: pwsh
        run: npm version --no-git-tag-version $env:PACKAGE_VERSION
      - run: npm run build
      - name: Build signed installer
        run: npx electron-builder --win nsis --x64 --publish never -c.forceCodeSigning=true
      - name: Verify Authenticode and checksums
        shell: pwsh
        run: |
          $installers = Get-ChildItem release -File -Filter *.exe
          if ($installers.Count -eq 0) {
            throw "No Windows installer was produced."
          }
          $evidence = foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature for $($installer.Name): $($signature.Status)"
            }
            "$($installer.Name): $($signature.Status); $($signature.SignerCertificate.Subject)"
          }
          $evidence | Tee-Object -FilePath release/verification-windows-x64.txt
          $checksums = foreach ($installer in $installers) {
            $hash = Get-FileHash -Algorithm SHA256 $installer.FullName
            "$($hash.Hash.ToLowerInvariant())  $($installer.Name)"
          }
          $checksums | Set-Content release/SHA256SUMS-windows-x64.txt
      - uses: actions/attest@v4
        with:
          subject-path: release/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.validate.outputs.artifact_prefix }}-windows-x64
          if-no-files-found: error
          path: |
            release/*.exe
            release/SHA256SUMS-windows-x64.txt
            release/verification-windows-x64.txt

  linux:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      PACKAGE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.source_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set preview package version
        if: needs.validate.outputs.channel == 'preview'
        run: npm version --no-git-tag-version "${PACKAGE_VERSION}"
      - run: npm run build
      - name: Build native packages
        run: npx electron-builder --linux AppImage deb --x64 --publish never
      - name: Record package checksums
        run: |
          sha256sum release/*.AppImage release/*.deb > release/SHA256SUMS-linux-x64.txt
          file release/*.AppImage release/*.deb | tee release/verification-linux-x64.txt
      - uses: actions/attest@v4
        with:
          subject-path: |
            release/*.AppImage
            release/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.validate.outputs.artifact_prefix }}-linux-x64
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb
            release/SHA256SUMS-linux-x64.txt
            release/verification-linux-x64.txt

  publish-preview:
    if: needs.validate.outputs.channel == 'preview'
    needs:
      - validate
      - macos
      - windows
      - linux
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PACKAGE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
      SOURCE_REF: ${{ needs.validate.outputs.source_ref }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ needs.validate.outputs.artifact_prefix }}-*
          path: release
          merge-multiple: true
      - name: Publish preview prerelease
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg channel "preview" \
            --arg version "${PACKAGE_VERSION}" \
            --arg tag "${RELEASE_TAG}" \
            --arg source_commit "${SOURCE_REF}" \
            '{channel: $channel, version: $version, tag: $tag, source_commit: $source_commit}' \
            > release/aldunis-code-preview.json
          mapfile -t assets < <(find release -type f \( \
            -name '*.dmg' -o \
            -name '*.exe' -o \
            -name '*.AppImage' -o \
            -name '*.deb' -o \
            -name 'SHA256SUMS-*' -o \
            -name 'verification-*' -o \
            -name 'aldunis-code-preview.json' \
          \) -print | sort)
          test "${#assets[@]}" -gt 0
          notes=$'Opt-in nightly preview build. This prerelease is for manual dogfooding; it does not publish update metadata or promote a Tenkai channel.\n\nSource commit: '"${SOURCE_REF}"
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
            gh release edit "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Aldunis Code Preview ${PACKAGE_VERSION}" \
              --prerelease \
              --notes "${notes}"
          else
            gh release create "${RELEASE_TAG}" "${assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${SOURCE_REF}" \
              --title "Aldunis Code Preview ${PACKAGE_VERSION}" \
              --prerelease \
              --notes "${notes}"
          fi
